[alembic]
# 遷移腳本目錄（相對於本 ini，即 backend/alembic）
script_location = alembic
# 讓 `import app` 可用：自 backend/ 執行時，`.` 即 backend/
prepend_sys_path = .
# sqlalchemy.url 留空；由 env.py 從 DATABASE_URL 環境變數讀取
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
